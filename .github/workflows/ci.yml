name: Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned MoonBit toolchain and core
        uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9

      - name: Update registry
        run: moon update

      - name: Check formatting including automation
        run: moon fmt --check . scripts/read_smoke.mbtx scripts/mutation_smoke.mbtx scripts/operations_smoke.mbtx scripts/api_smoke.mbtx scripts/release_candidate.mbtx scripts/verify_candidate.mbtx scripts/release_smoke.mbtx

      - name: Generate public interfaces
        run: moon info

      - name: Check generated interfaces are committed
        run: git diff --exit-code -- '*.mbti'

      - name: Build Windows CLI for diagnostics
        if: runner.os == 'Windows'
        run: moon build --target native --release --deny-warn

      - name: Diagnose Windows read fixtures
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: moon run --target native --strip --verbose scripts/read_smoke.mbtx -- _build/native/release/build/cmd/main/main.exe _build/windows-read-diagnostic.json

      - name: Check, test, build and exercise the staged Native binary
        run: moon run --target native scripts/release_candidate.mbtx -- _build/ci-candidate

      - name: Verify candidate and release tooling, including relocation
        run: moon run --target native scripts/release_smoke.mbtx -- _build/ci-candidate

      - name: Preserve candidate and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: |
            _build/ci-candidate/
            _build/increment-6-smoke.json
          if-no-files-found: warn
          retention-days: 14
